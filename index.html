
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Search</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #202124;
      background: #f5f7fb;
    }
    main { width: 100%; max-width: 600px; text-align: center; }
    h1 { font-size: 42px; margin-bottom: 10px; }
    p { color: #667085; margin-bottom: 28px; }
    form {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: white;
      border: 1px solid #d9deea;
      border-radius: 18px;
      box-shadow: 0 5px 24px #18284912;
    }
    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 12px;
      font-size: 16px;
      background: transparent;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #2457e6;
      color: white;
    }
    .engines { margin-top: 22px; }
    .engines button {
      margin: 4px;
      color: #2457e6;
      background: white;
      border: 1px solid #d9deea;
    }
    footer { margin-top: 40px; font-size: 12px; color: #8991a3; }
  </style>
</head>
<body>
  <main>
    <h1>Simple Search</h1>
    <p>무엇이든 검색해 보세요.</p>

    <form id="searchForm">
      <input id="query" type="search"
        placeholder="검색어를 입력하세요"
        aria-label="검색어" required>
      <button type="submit">검색</button>
    </form>

    <div class="engines">
      <p>검색할 사이트 선택</p>
      <button type="button" data-engine="google">Google</button>
      <button type="button" data-engine="bing">Bing</button>
    </div>

    <footer>Simple Search · 간편한 웹 검색</footer>
  </main>

  <script>
    const input = document.getElementById("query");
    let engine = "google";

    function search() {
      const q = input.value.trim();
      if (!q) {
        input.focus();
        return;
      }

      const base = engine === "bing"
        ? "https://www.bing.com/search?q="
        : "https://www.google.com/search?q=";

      window.location.href = base + encodeURIComponent(q);
    }

    document.getElementById("searchForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        search();
      });

    document.querySelectorAll("[data-engine]")
      .forEach(function (button) {
        button.addEventListener("click", function () {
          engine = button.dataset.engine;
          search();
        });
      });
  </script>
</body>
</html>
